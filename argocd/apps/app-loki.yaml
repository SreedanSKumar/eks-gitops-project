apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki-stack
    targetRevision: "2.*"
    helm:
      releaseName: loki
      values: |
        promtail:
          enabled: true
        loki:
          persistence:
            enabled: true
            size: 10Gi
        grafana:
          enabled: false   # reuse the Grafana already deployed by kube-prometheus-stack

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
