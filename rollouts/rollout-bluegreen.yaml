# Blue/Green rollout using the official argoproj/rollouts-demo image.
# The new color is deployed fully behind a preview service, validated,
# then cut over to the active service on promotion.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: demo-app
  labels:
    app: demo-app
spec:
  replicas: 5
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      containers:
        - name: demo-app
          image: argoproj/rollouts-demo:blue
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /color
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
  strategy:
    blueGreen:
      activeService: demo-app-active
      previewService: demo-app-preview
      autoPromotionEnabled: false   # require manual `kubectl argo rollouts promote demo-app`
      scaleDownDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app-active
spec:
  selector:
    app: demo-app
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app-preview
spec:
  selector:
    app: demo-app
  ports:
    - port: 80
      targetPort: 8080

# ---
# Trigger a new "green" version:
#   kubectl argo rollouts set image demo-app demo-app=argoproj/rollouts-demo:green
# Check the preview service to see it before it goes live:
#   kubectl port-forward svc/demo-app-preview 8081:80
# Once happy, cut traffic over:
#   kubectl argo rollouts promote demo-app
# Or abort and roll back to the last active color:
#   kubectl argo rollouts abort demo-app
